  legal_terms:
    heading: Uygulama Kullanım Şartları
    version_label: Sürüm
    intro: Bu uygulamayı kullanarak bu Kullanım Şartlarını, bağlantılı Gizlilik Politikasını ve geçerli Etsy platform kurallarını kabul etmiş olursunuz.
    service_scope_title: Hizmet Kapsamı
    service_scope_body: Bu uygulama Etsy OAuth üzerinden Etsy hesabınıza bağlanır ve sizin adınıza satıcı tarafından yetkilendirilmiş ilan ve envanter işlemlerini gerçekleştirir.
    etsy_compliance_title: Gerekli Etsy Uyumluluğu
    etsy_compliance_item_1: Etsy API Kullanım Şartlarına ve Geliştirici Şartlarına her zaman uymalısınız.
    etsy_compliance_item_2: Uygulamayı yalnızca yönetme yetkiniz olan hesaplar ve mağazalar için kullanabilirsiniz.
    etsy_compliance_item_3: Uygulamayı pazar yeri politikalarını, yürürlükteki yasaları veya üçüncü taraf haklarını ihlal edecek şekilde kullanamazsınız.
    data_access_title: Veri ve Erişim
    data_access_item_1: Talep edilen özelliklerin sunulması için gerekli Etsy verilerinin bu uygulama tarafından işlenmesine izin verirsiniz.
    data_access_item_2: Etsy hesabı bağlantısını panelden istediğiniz zaman kesebilirsiniz.
    data_access_item_3: Bağlantı kesildiğinde OAuth tokenları ve senkronize ilan önbelleği bu uygulama tarafından silinir.
    warranty_title: Garanti Reddi
    warranty_body: UYGULAMA "OLDUĞU GİBİ" VE "MEVCUT OLDUĞU ŞEKİLDE" SUNULUR; TİCARİ ELVERİŞLİLİK, BELİRLİ BİR AMACA UYGUNLUK VE İHLAL ETMEME DAHİL OLMAK ÜZERE AÇIK YA DA ZIMNİ HİÇBİR GARANTİ VERİLMEZ.
    support_title: Destek
    support_prefix: Hesap veya veri talepleri için iletişim

  legal_privacy:
    heading: Gizlilik Politikası
    version_label: Sürüm
    intro: Bu politika, bu uygulamanın toplu ilan fiyat güncelleme akışlarını sunmak için Etsy ile ilgili verileri nasıl işlediğini açıklar.
    data_processed_title: İşlenen Veriler
    data_processed_item_1: Etsy OAuth tokenları (dinlenimde şifreli olarak saklanır).
    data_processed_item_2: Hesap ve mağaza eşleştirmesi için gerekli Etsy hesap kimlikleri.
    data_processed_item_3: Seçim ve önizleme için kullanılan senkronize ilan meta verileri.
    data_processed_item_4: Güvenilirlik ve izlenebilirlik için iş yürütme kayıtları ve denetim olayları.
    purpose_title: Amaç
    purpose_item_1: Etsy hesabınızı kimlik doğrulamak.
    purpose_item_2: İlanları senkronize etmek ve iş hedeflemesini hazırlamak.
    purpose_item_3: Talep edilen fiyat ayarlamalarını çalıştırmak ve rapor sağlamak.
    retention_title: Saklama ve Silme
    retention_item_1: Etsy bağlantısını istediğiniz zaman kesebilirsiniz; bağlantı kesildiğinde OAuth tokenları ve senkronize ilan önbelleği silinir.
    retention_item_2: Operasyonel kayıtlar sorun giderme, güvenlik ve denetim amaçlarıyla tutulabilir.
    security_title: Güvenlik
    security_item_1: OAuth sırları ve tokenları hassas veri olarak ele alınır.
    security_item_2: Hassas değerler istemli olarak UI yanıtlarında gösterilmez.
    contact_title: İletişim
    contact_prefix: Gizlilik veya veri talepleri için iletişim

  legal:
    terms_title: Kullanım Şartları
    privacy_title: Gizlilik Politikası

