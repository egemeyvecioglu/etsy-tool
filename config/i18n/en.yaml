  legal_terms:
    heading: Application Terms of Use
    version_label: Version
    intro: By using this application, you agree to these Application Terms, the linked Privacy Policy, and applicable Etsy platform rules.
    service_scope_title: Service Scope
    service_scope_body: This application connects to your Etsy account through Etsy OAuth and performs seller-authorized listing and inventory actions on your behalf.
    etsy_compliance_title: Required Etsy Compliance
    etsy_compliance_item_1: You must comply with Etsy's API Terms of Use and Developer Terms at all times.
    etsy_compliance_item_2: You may only use the app with accounts and shops you are authorized to manage.
    etsy_compliance_item_3: You must not use the app to violate marketplace policies, applicable law, or third-party rights.
    data_access_title: Data and Access
    data_access_item_1: You authorize this app to process Etsy data needed to provide requested features.
    data_access_item_2: You can disconnect your Etsy account at any time from the dashboard.
    data_access_item_3: When disconnected, OAuth tokens and synced listing cache are removed by this app.
    warranty_title: Warranty Disclaimer
    warranty_body: THE APPLICATION IS PROVIDED "AS IS" AND "AS AVAILABLE" WITHOUT WARRANTIES OF ANY KIND, EXPRESS OR IMPLIED, INCLUDING IMPLIED WARRANTIES OF MERCHANTABILITY, FITNESS FOR A PARTICULAR PURPOSE, AND NON-INFRINGEMENT.
    support_title: Support
    support_prefix: For account or data requests, contact

  legal_privacy:
    heading: Privacy Policy
    version_label: Version
    intro: This policy describes how this application processes Etsy-related data to provide bulk listing price update workflows.
    data_processed_title: Data Processed
    data_processed_item_1: Etsy OAuth tokens (stored encrypted at rest).
    data_processed_item_2: Etsy account identifiers needed for account and shop linkage.
    data_processed_item_3: Synced listing metadata used for selection and previews.
    data_processed_item_4: Job execution logs and audit events for reliability and traceability.
    purpose_title: Purpose
    purpose_item_1: Authenticate your Etsy account.
    purpose_item_2: Sync listings and prepare job targeting.
    purpose_item_3: Run requested price adjustments and provide reports.
    retention_title: Retention and Removal
    retention_item_1: You can disconnect Etsy at any time; disconnect removes OAuth tokens and synced listing cache.
    retention_item_2: Operational logs may remain for troubleshooting, security, and audit purposes.
    security_title: Security
    security_item_1: OAuth secrets and tokens are treated as sensitive data.
    security_item_2: Sensitive values are never intentionally exposed in UI responses.
    contact_title: Contact
    contact_prefix: For privacy or data requests, contact

  legal:
    terms_title: Terms of Use
    privacy_title: Privacy Policy

